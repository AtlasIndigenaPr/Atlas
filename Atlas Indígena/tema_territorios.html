<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Indígena</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class=""> <div id="container">
    <div id="sidebar" class="sidebar">
        <button class="toggle-btn" id="toggle-left">◀</button>
        <div class="sidebar-header">
            <a href="index.html" class="btn-voltar-sidebar">
                <img src="Fotos/atlas_pr_cortada.jpg" alt="Voltar">
            </a>
            <strong style="font-family: 'Cinzel'; color: #d2691e;">Portal</strong>
        </div>
        <div class="sidebar-content">
           <div class="search-container">
    <input type="text" id="search-input" placeholder="Pesquisar Terra Indígena...">
    <!-- A lista de resultados será injetada aqui pelo JavaScript -->
    <div id="search-results" class="autocomplete-items"></div>
</div>
            <div id="info-dinamica">
                <p style="color: #777; font-style: italic; font-size: 0.9em;">Selecione uma área no mapa.</p>
            </div>
        </div>
    </div>

    
    <div id="map"></div>

</div>

<!-- index.html -->
<aside id="painel-lateral-info" class="painel-oculto">
    <button id="btn-fechar-painel" onclick="fecharPainelLateral()">✕</button>
    <div id="conteudo-dinamico-painel">
        <!-- O JavaScript vai injetar os dados de qualquer polígono aqui -->
    </div>
</aside>

<!-- 1. Importar o Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 2. Importar o PapaParse para ler o CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- 3. Seu script (sem o atributo 'src' para que o código interno funcione) -->
    <script>
        // Inicialização básica do mapa (ajuste as coordenadas para o centro do PR)
        const map = L.map('map').setView([-24.5, -51.0], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // --- CARREGAR A PLANILHA (PONTOS) ---
        const urlPlanilhaCSV = 'https://docs.google.com/spreadsheets/d/1QIuXfJhHphae_H66Jksv0AfnvtaLZJZv3yU_UeCZFtw/edit?usp=sharing'; 

        Papa.parse(urlPlanilhaCSV, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                // Filtra linhas que tenham latitude e longitude válidas
                const dadosValidos = results.data.filter(linha => linha.lat && linha.lon);

                // Cria os pontos no Leaflet
                dadosValidos.forEach(linha => {
                    // No Leaflet, a ordem é [latitude, longitude]
                    const marcador = L.circleMarker([linha.lat, linha.lon], {
                        color: '#ffffff',
                        fillColor: '#1e90ff',
                        fillOpacity: 1,
                        radius: 8,
                        weight: 2
                    }).addTo(map);

                    // Evento de clique para o Leaflet
                    marcador.on('click', () => {
                        document.getElementById('info-dinamica').innerHTML = `
                            <h2>${linha.titulo_demanda}</h2>
                            <div class="info-box" style="border-top: 4px solid #1e90ff;">
                                <p><strong>Comunidade:</strong> ${linha.comunidade}</p>
                                <p><strong>Data:</strong> ${linha.data}</p>
                                <p><strong>Categoria:</strong> <span class="tag">${linha.categoria}</span></p>
                                <p><strong>Descrição:</strong> ${linha.descricao}</p>
                            </div>
                        `;
                    });
                });
            }
        });
    </script>
</body>
</html>
